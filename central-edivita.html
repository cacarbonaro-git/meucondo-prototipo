<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central EdiVita — back-office do provedor</title>
<style>
  :root{
    --verde:#0e7a5f; --verde-escuro:#0a5c47; --verde-claro:#e6f2ee; --dourado:#b08d4f;
    --texto:#16241f; --cinza:#6b7a74; --cinza-claro:#f1f5f3; --borda:#e2e8e5;
    --branco:#ffffff; --fundo:#f6f8f7; --vermelho:#c0392b; --laranja:#d98218; --azul:#2b6cb0;
    --sombra:0 1px 3px rgba(16,40,30,.06),0 4px 16px rgba(16,40,30,.05);
    --raio:14px;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--fundo); color:var(--texto); font-size:14px; line-height:1.45}
  a{color:inherit}
  .app{display:flex; min-height:100vh}
  /* sidebar */
  .side{width:240px; flex:0 0 240px; background:linear-gradient(170deg,var(--verde-escuro),#083b2e); color:#eafaf4; padding:20px 14px; position:sticky; top:0; height:100vh}
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px}
  .brand .logo{width:38px; height:38px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:3px; flex:0 0 auto}
  .brand .logo svg{width:100%; height:100%; display:block}
  .toplogo{display:none; width:30px; height:30px; border-radius:8px; background:#fff; border:1px solid var(--borda); padding:2px; overflow:hidden; flex:0 0 auto}
  .toplogo svg{width:100%; height:100%; display:block}
  /* navegação inferior (mobile) */
  .botnav{display:none}
  .brand b{font-size:16px; letter-spacing:.02em} .brand span{display:block; font-size:11px; opacity:.75; font-weight:500}
  .nav button{width:100%; text-align:left; background:none; border:none; color:#dff3eb; padding:11px 12px; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:10px; margin-bottom:2px}
  .nav button:hover{background:rgba(255,255,255,.08)}
  .nav button.on{background:rgba(255,255,255,.16); color:#fff}
  .nav .ic{width:20px; display:inline-flex; align-items:center; justify-content:center; opacity:.95}
  .nav .ic svg, .botnav .ic svg{display:block}
  .side .rodape{position:absolute; bottom:16px; left:14px; right:14px; font-size:11px; opacity:.7; border-top:1px solid rgba(255,255,255,.15); padding-top:12px}
  /* main */
  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .top{background:var(--branco); border-bottom:1px solid var(--borda); padding:14px 26px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:5}
  .top h1{font-size:18px; margin:0; flex:1}
  .top .busca{position:relative}
  .top .busca input{border:1px solid var(--borda); border-radius:10px; padding:9px 12px 9px 34px; font:inherit; width:240px; background:var(--cinza-claro)}
  .busca .lupa-ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--cinza); pointer-events:none; display:flex}
  .busca .lupa-ic svg{width:16px; height:16px; display:block}
  .op{display:flex; align-items:center; gap:9px; font-weight:600; font-size:13px}
  .op .av{width:32px; height:32px; border-radius:50%; background:var(--verde); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px}
  .op small{display:block; font-weight:500; color:var(--cinza)}
  .wrap{padding:24px 26px; max-width:1180px}
  /* cards / kpis */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px}
  .kpi{background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio); padding:16px 16px 14px; box-shadow:var(--sombra)}
  .kpi .lbl{font-size:12px; color:var(--cinza); font-weight:600; text-transform:uppercase; letter-spacing:.03em}
  .kpi .val{font-size:26px; font-weight:800; margin-top:6px; letter-spacing:-.01em}
  .kpi .sub{font-size:12px; color:var(--cinza); margin-top:3px}
  .kpi .up{color:var(--verde)} .kpi .down{color:var(--vermelho)}
  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:18px; align-items:start}
  .grid2.eq{grid-template-columns:1fr 1fr}
  .card{background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio); box-shadow:var(--sombra); overflow:hidden}
  .card h2{font-size:14px; margin:0; padding:15px 18px; border-bottom:1px solid var(--borda); display:flex; align-items:center; gap:8px}
  .card h2 .chip{margin-left:auto}
  .card .body{padding:16px 18px}
  .secao{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--cinza); margin:22px 0 10px}
  /* chips */
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--cinza-claro); color:var(--cinza); white-space:nowrap}
  .chip.verde{background:var(--verde-claro); color:var(--verde-escuro)}
  .chip.dourado{background:#f6efe0; color:#8a6a2b}
  .chip.laranja{background:#fdf0e0; color:#9a5a12}
  .chip.vermelho{background:#fbe9e7; color:#a5271b}
  .chip.azul{background:#e8f0f9; color:#245586}
  .chip.cinza{background:var(--cinza-claro); color:var(--cinza)}
  /* tabela */
  .tabela-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{width:100%; border-collapse:collapse; font-size:13px}
  .tabela-scroll table{min-width:720px}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--cinza); padding:11px 14px; border-bottom:1px solid var(--borda); background:var(--cinza-claro); white-space:nowrap}
  tbody td{padding:12px 14px; border-bottom:1px solid var(--borda); vertical-align:middle}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--verde-claro)}
  td .nm{font-weight:700} td .cod{display:inline-block; white-space:nowrap; font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--verde-escuro); background:var(--verde-claro); padding:1px 6px; border-radius:6px}
  .barra{height:7px; border-radius:6px; background:var(--cinza-claro); overflow:hidden; min-width:70px}
  .barra > i{display:block; height:100%; background:var(--verde); border-radius:6px}
  .filtros{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .filtros button{border:1px solid var(--borda); background:var(--branco); border-radius:999px; padding:6px 13px; font:inherit; font-size:12.5px; font-weight:600; color:var(--cinza); cursor:pointer}
  .filtros button.on{background:var(--verde); border-color:var(--verde); color:#fff}
  /* botões */
  .btn{border:1px solid var(--borda); background:var(--branco); border-radius:10px; padding:9px 15px; font:inherit; font-weight:700; cursor:pointer; color:var(--texto)}
  .btn.prim{background:var(--verde); border-color:var(--verde); color:#fff}
  .btn.danger{background:#fff; border-color:var(--vermelho); color:var(--vermelho)}
  .btn.sm{padding:6px 11px; font-size:12.5px}
  .btn.ghost{background:none; border:none; color:var(--verde-escuro); padding:0; font-weight:700; cursor:pointer}
  /* toggle */
  .tg{position:relative; width:42px; height:24px; border-radius:999px; background:#cfd8d4; border:none; cursor:pointer; flex:0 0 auto; transition:background .15s}
  .tg.on{background:var(--verde)}
  .tg::after{content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .tg.on::after{left:20px}
  .tg[disabled]{opacity:.5; cursor:not-allowed}
  .modrow{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--borda)}
  .modrow:last-child{border-bottom:none}
  .aten-grid{display:grid; grid-template-columns:1fr 1fr; column-gap:26px; padding-top:2px; padding-bottom:2px}
  .aten-grid .modrow{padding:12px 0}
  .aten-grid .modrow > .chip:first-child{flex:0 0 92px; justify-content:center}
  @media(max-width:820px){ .aten-grid{grid-template-columns:1fr} }
  .modrow .mi{flex:1} .modrow .mi b{display:block} .modrow .mi small{color:var(--cinza)}
  /* detalhe head */
  .dhead{display:flex; align-items:flex-start; gap:16px; margin-bottom:18px}
  .dhead .ava{width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:20px; flex:0 0 auto}
  .dhead h1{margin:0; font-size:22px}
  .dl{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:13px}
  .dl dt{color:var(--cinza); font-weight:600} .dl dd{margin:0; font-weight:600}
  .voltar{background:none; border:none; color:var(--verde-escuro); font-weight:700; cursor:pointer; padding:0; margin-bottom:14px; font-size:13px}
  /* barras svg */
  .bars{display:flex; align-items:flex-end; gap:6px; height:176px; padding:20px 2px 0}
  .bars .b{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end}
  .bars .b > i{position:relative; width:100%; max-width:34px; flex:0 0 auto; background:linear-gradient(180deg,var(--verde),var(--verde-escuro)); border-radius:6px 6px 0 0; display:block}
  .bars .b.cur > i{background:linear-gradient(180deg,var(--dourado),#8a6a2b)}
  .bars .b small{font-size:10.5px; color:var(--cinza); flex:0 0 auto}
  .bars .b em{position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--cinza); font-style:normal; white-space:nowrap}
  @media(max-width:640px){ .bars{gap:5px} .bars .b em{display:none} .bars .b.cur em, .bars .b.sel em{display:block} .bars.hassel .b.cur:not(.sel) em{display:none} .bars .b small{font-size:9.5px} }
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--verde-escuro); color:#fff; padding:12px 20px; border-radius:12px; font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
  .avlgpd{background:var(--verde-claro); border-radius:10px; padding:10px 13px; font-size:12px; color:var(--verde-escuro); margin-top:16px}
  .muted{color:var(--cinza)}
  @media(max-width:920px){
    .side{display:none} .kpis{grid-template-columns:repeat(2,1fr)} .grid2, .grid2.eq{grid-template-columns:1fr}
    .toplogo{display:flex} .wrap{padding-bottom:78px}
    .botnav{display:flex; position:fixed; left:0; right:0; bottom:0; background:var(--branco); border-top:1px solid var(--borda); z-index:20; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow:0 -2px 10px rgba(16,40,30,.06); overflow-x:auto; -webkit-overflow-scrolling:touch}
    .botnav button{flex:1 0 auto; min-width:56px; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; font:inherit; font-size:9.5px; font-weight:700; color:var(--cinza); cursor:pointer; padding:5px 2px; border-radius:9px; white-space:nowrap}
    .botnav button.on{color:var(--verde); background:var(--verde-claro)}
    .botnav .ic{display:inline-flex; align-items:center; justify-content:center; line-height:1}
  }
  @media(max-width:640px){
    .top{flex-wrap:wrap; padding:12px 16px; gap:10px}
    .top h1{flex:1 0 auto; font-size:17px}
    .top .op{order:2}
    .busca{flex:1 1 100%; order:3} .top .busca input{width:100%}
    .wrap{padding:16px 14px}
    .kpis{grid-template-columns:1fr 1fr; gap:10px}
    .kpi .val{font-size:22px}
    .filtros{flex-wrap:wrap}
    .admfil{margin-left:0 !important; flex:1 1 100%; margin-top:2px}
    .admsel{flex:1; max-width:none !important}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 14 L88 44 V90 a4 4 0 0 1-4 4 H20 a4 4 0 0 1-4-4 V44 Z" fill="#0e7a5f"/><path d="M50 14 L88 44 H12 Z" fill="#eab14a"/><rect x="33" y="52" width="34" height="30" rx="8" fill="#fff"/><circle cx="44" cy="65" r="3.6" fill="#0e7a5f"/><circle cx="56" cy="65" r="3.6" fill="#0e7a5f"/><path d="M44 73 q6 5 12 0" fill="none" stroke="#0e7a5f" stroke-width="2.6" stroke-linecap="round"/></svg></div><div><b>EdiVita</b><span>Central · back-office</span></div></div>

function ico(n,t){ t=t||18; return `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto">${ICO[n]||''}</svg>`; }

/* ===== Planos e módulos (catálogo do provedor) ===== */
const MODULOS = {

const PLANOS = {

  pro:{nome:'Pro', preco:5.90, cor:'verde', base:['financeiro','comunicacao','ocorrencias','reservas','manutencao','assembleia','acessibilidade']},

};
const STATUS = {
  ativo:{rot:'Ativo', chip:'verde'}, onboarding:{rot:'Onboarding', chip:'laranja'}, suspenso:{rot:'Suspenso', chip:'vermelho'},
};

/* helper: liga os módulos-base do plano num objeto {mod:bool} */
function modsDoPlano(plano, extras){
  const o={}; Object.keys(MODULOS).forEach(k=>o[k]=false);
  (PLANOS[plano].base||[]).forEach(k=>o[k]=true);
  (extras||[]).forEach(k=>o[k]=true);
  return o;
}

/* Health score da conta (sinais de conta, agregados) → 0–100 + classe + motivos + ação */
function saudeScore(c){
  if(c.status==='onboarding') return {na:true, cls:'cinza', rot:'em implantação'};
  let s=100; const m=[];
  if(c.status==='suspenso'){ s=18; m.push('conta suspensa (inadimplência)'); }
  const at=ativacao(c);
  if(at<40){ s-=30; m.push('ativação baixa ('+at+'%)'); } else if(at<70){ s-=12; m.push('ativação a subir ('+at+'%)'); }
  if(!c.edi.sind){ s-=25; m.push('síndico não está usando o app'); }
  if(c.edi.defl<0.35){ s-=15; m.push('Edi resolvendo pouco (deflexão '+Math.round(c.edi.defl*100)+'%)'); }
  if(c.edi.msgs < c.aptos*0.6){ s-=10; m.push('uso do Edi abaixo do esperado'); }
  if(c.edi.cons){ s-=8; m.push('conselho vago'); }
  if(c.edi.uso>14){ s-=15; m.push('sem acesso relevante há '+c.edi.uso+' dias'); }
  s=Math.max(0,Math.min(100,s));
  const cls = s>=75?'verde':(s>=50?'dourado':'vermelho');
  const rot = s>=75?'saudável':(s>=50?'atenção':'risco');
  let acao='Relacionamento em dia — manter o ritmo.';
  if(c.status==='suspenso') acao='Acionar cobrança/negociação — regularizar pra reativar.';
  else if(!c.edi.sind) acao='Reengajar o síndico (é o motor da adoção) — agendar sessão de sucesso.';
  else if(at<40) acao='Campanha de ativação de moradores (convite em massa + digest no WhatsApp).';
  else if(c.edi.defl<0.35) acao='Treinar o Edi: anexar regimento/convenção pra subir a deflexão.';
  else if(s<75) acao='Acompanhar de perto neste ciclo.';
  return {score:s, cls, rot, motivos:m, acao};
}

  let lst=CONDS.filter(c=>FILTRO==='todos'||c.status===FILTRO);
  if(FILTRO_ADM!=='todas') lst=lst.filter(c=>admDe(c)===FILTRO_ADM);
  if(BUSCA) lst=lst.filter(c=>c.nome.toLowerCase().includes(BUSCA)||c.cod.toLowerCase().includes(BUSCA)||c.cidade.toLowerCase().includes(BUSCA)||admDe(c).toLowerCase().includes(BUSCA));
  const fbtn=(k,l)=>`<button class="${FILTRO===k?'on':''}" onclick="FILTRO='${k}';render()">${l} (${cont(k)})</button>`;
  /* contagem das administradoras já considerando o filtro de status ativo (evita "(3)" mostrando 0) */
  const baseStatus=CONDS.filter(c=>FILTRO==='todos'||c.status===FILTRO);
  const admCount={}; baseStatus.forEach(c=>{const a=admDe(c); admCount[a]=(admCount[a]||0)+1;});
  const adms=resumoAdms();
  const filtroAtivo = FILTRO!=='todos'||FILTRO_ADM!=='todas'||!!BUSCA;
  return `
  <div class="filtros">
    ${fbtn('todos','Todos')} ${fbtn('ativo','Ativos')} ${fbtn('onboarding','Onboarding')} ${fbtn('suspenso','Suspensos')}
    <label class="admfil muted" style="font-size:12px; font-weight:700; margin-left:auto; display:flex; align-items:center; gap:6px">Administradora
    <select class="admsel" onchange="FILTRO_ADM=this.value;render()" style="border:1px solid var(--borda); border-radius:8px; padding:5px 8px; font:inherit; font-size:12.5px; font-weight:600; background:var(--branco); color:var(--texto); cursor:pointer; max-width:180px">
      <option value="todas"${FILTRO_ADM==='todas'?' selected':''}>Todas (${baseStatus.length})</option>
      ${adms.map(a=>`<option value="${a.nome.replace(/"/g,'&quot;')}"${FILTRO_ADM===a.nome?' selected':''}>${a.nome} (${admCount[a.nome]||0})</option>`).join('')}
    </select></label>
  </div>
  <div class="muted" style="font-size:12px; margin:-6px 0 12px">${lst.length} de ${CONDS.length}${filtroAtivo?` · <button class="btn ghost" style="font-size:12px" onclick="limparFiltrosConds()">limpar filtros</button>`:''}</div>
  ${lst.length? `<div class="card"><div class="tabela-scroll"><table>
    <thead><tr><th>Condomínio</th><th>Código</th><th>Aderência</th><th>Plano</th><th>Status</th><th>Ativação</th><th style="text-align:right">Receita/mês</th></tr></thead>
    <tbody>${lst.map(c=>`<tr onclick="abrirCond(${c.id})">
      <td><span class="nm">${c.nome}</span><br><small class="muted">${c.cidade} · ${c.aptos} un. · ${admDe(c)}</small></td>
      <td><span class="cod">${c.cod}</span></td>
      <td>${c.aderencia}</td>
      <td><span class="chip ${PLANOS[c.plano].cor}">${PLANOS[c.plano].nome}</span></td>
      <td><span class="chip ${STATUS[c.status].chip}">${STATUS[c.status].rot}</span></td>
      <td><div style="display:flex; align-items:center; gap:8px"><div class="barra" style="flex:1"><i style="width:${ativacao(c)}%"></i></div><small class="muted">${c.usando}/${c.aptos}</small></div></td>
      <td style="text-align:right; font-weight:700">${c.status==='ativo'?fmtK(precoCond(c)):'<span class="muted">—</span>'}</td>
    </tr>`).join('')}</tbody>
  </table></div></div>`
  : `<div class="card"><div class="body muted" style="text-align:center; padding:28px 16px">Nenhum condomínio combina com esses filtros.${filtroAtivo?`<br><button class="btn sm" style="margin-top:10px" onclick="limparFiltrosConds()">Limpar filtros</button>`:''}</div></div>`}`;
}
function limparFiltrosConds(){ FILTRO='todos'; FILTRO_ADM='todas'; BUSCA=''; const b=document.getElementById('busca'); if(b) b.value=''; render(); }

/* ===== Detalhe do condomínio ===== */
function telaDetalhe(){
  const c=SEL; if(!c) return telaConds();
  const cor=PLANOS[c.plano].cor==='dourado'?'var(--dourado)':(PLANOS[c.plano].cor==='verde'?'var(--verde)':'#8894a0');
  const inic=c.nome.replace(/^(Residencial|Edifício|Ed\.|Condomínio)\s*/,'').slice(0,2).toUpperCase();
  const aAtivar=c.aptos-c.usando;
  return `
  <button class="voltar" onclick="ir('conds')">‹ voltar à carteira</button>
  <div class="dhead">
    <div class="ava" style="background:${cor}">${inic}</div>
    <div style="flex:1">
      <h1>${c.nome}</h1>
      <div style="margin-top:6px; display:flex; gap:8px; flex-wrap:wrap; align-items:center">
        <span class="cod">${c.cod}</span>
        <span class="chip ${STATUS[c.status].chip}">${STATUS[c.status].rot}</span>
        <span class="chip ${PLANOS[c.plano].cor}">Plano ${PLANOS[c.plano].nome}</span>
        <span class="muted" style="font-size:12px">no Edi desde ${c.aderencia}</span>
      </div>
    </div>
    <div style="text-align:right">
      ${c.status!=='suspenso'
        ? `<button class="btn danger sm" onclick="mudarStatus(${c.id},'suspenso')">Suspender conta</button>`
        : `<button class="btn prim sm" onclick="mudarStatus(${c.id},'ativo')">Reativar conta</button>`}
      ${c.status==='onboarding'?`<button class="btn prim sm" onclick="mudarStatus(${c.id},'ativo')" style="margin-left:6px">Concluir ativação</button>`:''}
    </div>
  </div>
  <div class="grid2">
    <div class="card"><h2>${ico("predio")} Dados do condomínio</h2><div class="body">
      <dl class="dl">
        <dt>Endereço</dt><dd>${c.end}</dd>
        <dt>Cidade</dt><dd>${c.cidade}</dd>
        <dt>Unidades</dt><dd>${c.aptos} apartamentos</dd>
        <dt>Síndico(a)</dt><dd>${c.sindico.nome} · <a href="https://wa.me/55${c.sindico.tel.replace(/\D/g,'')}" target="_blank" style="color:var(--verde-escuro)">${c.sindico.tel}</a></dd>
        <dt>Administradora</dt><dd>${c.adm?`${c.adm.nome} · <a href="https://wa.me/55${c.adm.tel.replace(/\D/g,'')}" target="_blank" style="color:var(--verde-escuro)">${c.adm.tel}</a>`:'<span class="muted">Autogerido (sem administradora)</span>'}</dd>
        <dt>Código no Edi</dt><dd><span class="cod">${c.cod}</span></dd>
      </dl>
    </div></div>
    <div class="card"><h2>${ico("pessoas")} Ativação dos condôminos</h2><div class="body">
      <div style="display:flex; align-items:baseline; gap:8px"><span style="font-size:32px; font-weight:800">${c.usando}</span><span class="muted">de ${c.aptos} unidades usando</span></div>
      <div class="barra" style="height:12px; margin:12px 0 8px"><i style="width:${ativacao(c)}%"></i></div>
      <div style="display:flex; justify-content:space-between; font-size:13px"><b>${ativacao(c)}% ativado</b><span class="muted">${aAtivar} a ativar</span></div>
      <div class="avlgpd" style="margin-top:14px">Faturamento deste condomínio: <b>${c.status==='ativo'?fmtBRL(precoCond(c))+'/mês':'—'}</b> ${c.status==='ativo'?`(${c.aptos} un. × ${fmtBRL(PLANOS[c.plano].preco)})`:`(conta ${STATUS[c.status].rot.toLowerCase()})`}</div>
    </div></div>
  </div>
  <div class="secao">Plano & módulos ativos</div>
  <div class="card"><div class="body">
    <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center">
      <span class="muted" style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em">Plano</span>
      ${Object.keys(PLANOS).map(p=>`<button class="btn sm ${c.plano===p?'prim':''}" onclick="mudarPlano(${c.id},'${p}')">${PLANOS[p].nome} · ${fmtBRL(PLANOS[p].preco)}/un.</button>`).join('')}
    </div>
    <div class="muted" style="font-size:12px; margin-bottom:6px">O plano já liga um conjunto-base; abaixo você liga/desliga módulos avulsos por conta. Módulos do plano vêm marcados; add-ons você controla aqui.</div>
    ${Object.keys(MODULOS).map(k=>{const noPlano=(PLANOS[c.plano].base||[]).includes(k);const on=c.mods[k];return `<div class="modrow">
      <button class="tg ${on?'on':''}" onclick="toggleMod(${c.id},'${k}')" aria-label="${MODULOS[k].nome}"></button>
      <div class="mi"><b>${MODULOS[k].nome} ${noPlano?'<span class="chip verde" style="font-size:10px">no plano</span>':'<span class="chip cinza" style="font-size:10px">add-on</span>'}</b><small>${MODULOS[k].desc}</small></div>
    </div>`;}).join('')}
  </div></div>`;
}

/* ===== Saúde & risco de churn ===== */
function telaSaude(){
  const base=CONDS.filter(c=>c.status!=='onboarding');
  const scored=base.map(c=>({c, h:saudeScore(c)})).sort((a,b)=>a.h.score-b.h.score);
  const nV=scored.filter(x=>x.h.cls==='verde').length, nA=scored.filter(x=>x.h.cls==='dourado').length, nR=scored.filter(x=>x.h.cls==='vermelho').length;
  const onb=CONDS.filter(c=>c.status==='onboarding').length;
  return `
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="lbl"><span class="chip verde">Saudáveis</span></div><div class="val">${nV}</div><div class="sub">score ≥ 75</div></div>
    <div class="kpi"><div class="lbl"><span class="chip dourado">Atenção</span></div><div class="val">${nA}</div><div class="sub">score 50–74</div></div>
    <div class="kpi"><div class="lbl"><span class="chip vermelho">Risco de churn</span></div><div class="val">${nR}</div><div class="sub">score &lt; 50 — agir</div></div>
  </div>
  <div class="secao">Contas por prioridade (piores primeiro)</div>
  <div class="card"><div class="body">
    ${scored.map(({c,h})=>`<div class="modrow">
      <span class="chip ${h.cls}" style="min-width:50px; justify-content:center; font-size:13px">${h.score}</span>
      <div class="mi"><b>${c.nome} <span class="muted" style="font-weight:500">· ${h.rot}</span></b><small>${h.motivos.length?h.motivos.join(' · '):'sem alertas'}</small><small style="display:block; color:var(--verde-escuro); margin-top:2px">→ ${h.acao}</small></div>
      <button class="btn ghost" style="font-size:12px" onclick="abrirCond(${c.id})">abrir</button>
    </div>`).join('')}
  </div></div>
  ${onb?`<div class="avlgpd">${onb} conta(s) em <b>onboarding</b> ficam fora do score até concluir a ativação.</div>`:''}
  <div class="avlgpd">O score combina <b>ativação</b>, <b>uso do Edi</b>, <b>síndico ativo</b>, <b>conselho</b> e <b>inadimplência</b> — sinais de <b>conta</b>, agregados; nada de dado operacional do tenant.</div>`;
}

/* ===== Uso do Edi & deflexão ===== */
const EDI_TEMAS=[['2ª via de boleto',3120],['Horário de silêncio / barulho',1980],['Reserva do salão de festas',1450],['Regras de reforma na unidade',1120],['Animais nas áreas comuns',870],['Vaga de visitante',760]];
const EDI_LACUNAS=[['Uso da piscina (horário e regras)','anexar o regimento atualizado — seção lazer'],['Valor da multa por barulho','conferir se a convenção define o valor'],['Mudança / elevador de serviço','anexar a norma de mudanças do condomínio']];
function telaEdi(){
  const at=ativos().filter(c=>c.edi.msgs>0);
  const msgs=at.reduce((s,c)=>s+c.edi.msgs,0);
  const deflMed=msgs? at.reduce((s,c)=>s+c.edi.msgs*c.edi.defl,0)/msgs : 0;
  const evit=Math.round(msgs*deflMed);
  const rank=[...at].sort((a,b)=>b.edi.defl-a.edi.defl);
  const maxT=EDI_TEMAS[0][1];
  return `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Mensagens ao Edi (mês)</div><div class="val">${msgs.toLocaleString('pt-BR')}</div><div class="sub">${at.length} condomínios com Edi ativo</div></div>
    <div class="kpi"><div class="lbl">Deflexão média</div><div class="val">${Math.round(deflMed*100)}%</div><div class="sub">resolvido pelo Edi sem virar chamado</div></div>
    <div class="kpi"><div class="lbl">Chamados evitados</div><div class="val">${evit.toLocaleString('pt-BR')}</div><div class="sub">estimativa no mês</div></div>
    <div class="kpi"><div class="lbl">Contas sem uso do Edi</div><div class="val">${ativos().length-at.length}</div><div class="sub">oportunidade de ativação</div></div>
  </div>
  <div class="grid2 eq">
    <div class="card"><h2>${ico('chat')} Deflexão por condomínio</h2><div class="body">
      ${rank.map(c=>{const p=Math.round(c.edi.defl*100);return `<div class="modrow"><span class="chip ${p>=60?'verde':(p>=40?'dourado':'vermelho')}" style="min-width:46px; justify-content:center">${p}%</span><div class="mi"><b>${c.nome}</b><small>${c.edi.msgs.toLocaleString('pt-BR')} mensagens no mês</small></div><button class="btn ghost" style="font-size:12px" onclick="abrirCond(${c.id})">abrir</button></div>`;}).join('')}
    </div></div>
    <div class="card"><h2>${ico('modulos')} Temas mais perguntados</h2><div class="body">
      ${EDI_TEMAS.map(([t,n])=>`<div class="modrow"><div class="mi"><b>${t}</b><small>${n.toLocaleString('pt-BR')} perguntas</small></div><div class="barra" style="width:110px"><i style="width:${Math.round(100*n/maxT)}%"></i></div></div>`).join('')}
    </div></div>
  </div>
  <div class="secao">Lacunas de conhecimento (perguntas que caíram fora das fontes)</div>
  <div class="card"><div class="body">
    ${EDI_LACUNAS.map(([q,s])=>`<div class="modrow"><span class="chip laranja">lacuna</span><div class="mi"><b>${q}</b><small>sugestão: ${s}</small></div></div>`).join('')}
    <div class="avlgpd" style="margin-top:12px">Agregado e anônimo da carteira (não expõe conversa nem morador). Vira backlog pra melhorar a base legal e os documentos-modelo — o que sobe a deflexão em <b>todos</b> os condomínios de uma vez.</div>
  </div></div>`;
}

/* ===== Financeiro (Receita/MRR + Cobrança) ===== */
let FIN_TAB='receita';
function telaFinanceiro(){
  const tab=(k,l)=>`<button class="${FIN_TAB===k?'on':''}" onclick="FIN_TAB='${k}';render()">${l}</button>`;
  return `<div class="filtros" style="margin-bottom:16px">${tab('receita','Receita (MRR)')} ${tab('cobranca','Cobrança')} ${tab('expansao','Expansão')}</div>${FIN_TAB==='cobranca'?finCobranca():(FIN_TAB==='expansao'?finExpansao():finReceita())}`;
}
function finReceita(){
  const mrr=mrrAtual(), at=ativos().length, arpa=at?mrr/at:0, unid=ativos().reduce((s,c)=>s+c.aptos,0);
  const porPlano=['essencial','pro','premium'].map(p=>{const l=ativos().filter(c=>c.plano===p);return {p, n:l.length, rec:l.reduce((s,c)=>s+precoCond(c),0)};});
  const lista=[...ativos()].sort((a,b)=>precoCond(b)-precoCond(a));
  return `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Receita mensal (MRR)</div><div class="val">${fmtK(mrr)}</div><div class="sub up">&#9650; ${fmtK(mrr-HIST[HIST.length-1][1])} vs. Jul</div></div>
    <div class="kpi"><div class="lbl">Receita anual (ARR)</div><div class="val">${fmtK(mrr*12)}</div><div class="sub">projeção anualizada ao ritmo atual</div></div>
    <div class="kpi"><div class="lbl">Receita média por condomínio (ARPA)</div><div class="val">${fmtBRL(arpa)}</div><div class="sub">MRR ÷ contas ativas</div></div>
    <div class="kpi"><div class="lbl">Unidades faturadas</div><div class="val">${unid.toLocaleString('pt-BR')}</div><div class="sub">${at} contas ativas</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>${ico("tendencia")} Receita mensal (MRR), mês a mês</h2><div class="body">${barsMRR()}</div></div>
    <div class="card"><h2>${ico("modulos")} Receita por plano</h2><div class="body">
      ${porPlano.map(x=>{const pct=mrr?Math.round(100*x.rec/mrr):0;return `<div class="modrow"><span class="chip ${PLANOS[x.p].cor}" style="min-width:78px; justify-content:center">${PLANOS[x.p].nome}</span><div class="mi"><b>${fmtK(x.rec)}/mês</b><small>${x.n} contas · ${pct}% da receita</small></div><div class="barra" style="width:90px"><i style="width:${pct}%"></i></div></div>`;}).join('')}
    </div></div>
  </div>
  <div class="secao">Faturamento por condomínio (mês corrente) <button class="btn ghost" style="float:right; font-size:12px" onclick="toast('Exportação simulada — no produto, gera CSV/nota.')">exportar CSV ›</button></div>
  <div class="card"><div class="tabela-scroll"><table>
    <thead><tr><th>Condomínio</th><th>Plano</th><th>Unidades</th><th>Preço/un.</th><th style="text-align:right">Valor mensal</th></tr></thead>
    <tbody>${lista.map(c=>`<tr onclick="abrirCond(${c.id})"><td><span class="nm">${c.nome}</span><br><small class="muted">${c.cod}</small></td><td><span class="chip ${PLANOS[c.plano].cor}">${PLANOS[c.plano].nome}</span></td><td>${c.aptos}</td><td>${fmtBRL(PLANOS[c.plano].preco)}</td><td style="text-align:right; font-weight:700">${fmtBRL(precoCond(c))}</td></tr>`).join('')}
    <tr style="background:var(--verde-claro)"><td colspan="4" style="font-weight:800">Total — receita mensal (MRR)</td><td style="text-align:right; font-weight:800">${fmtBRL(mrr)}</td></tr></tbody>
  </table></div></div>
  <div class="avlgpd">Contas em <b>onboarding</b> e <b>suspensas</b> não entram na receita recorrente (MRR) — refletem o faturamento real do Edi. Suspender/reativar um condomínio no detalhe recalcula tudo aqui na hora.</div>`;
}
/* Cobrança do provedor: faturas que a EdiVita emite às contas (contas a receber) */
const FSTAT={paga:{rot:'Paga',chip:'verde'},aberta:{rot:'Em aberto',chip:'dourado'},vencida:{rot:'Vencida',chip:'vermelho'}};
function finCobranca(){
  const comFat=CONDS.filter(c=>c.fatura);
  const val=c=>c.aptos*PLANOS[c.plano].preco;
  const recebido=comFat.filter(c=>c.fatura.st==='paga').reduce((s,c)=>s+val(c),0);
  const aberto=comFat.filter(c=>c.fatura.st==='aberta').reduce((s,c)=>s+val(c),0);
  const vencido=comFat.filter(c=>c.fatura.st==='vencida').reduce((s,c)=>s+val(c),0);
  const totalCiclo=recebido+aberto+vencido;
  const inad=totalCiclo?Math.round(100*vencido/totalCiclo):0;
  const ordem={vencida:0,aberta:1,paga:2};
  const lst=[...comFat].sort((a,b)=>ordem[a.fatura.st]-ordem[b.fatura.st]||val(b)-val(a));
  return `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Recebido no ciclo</div><div class="val">${fmtK(recebido)}</div><div class="sub">${comFat.filter(c=>c.fatura.st==='paga').length} faturas pagas</div></div>
    <div class="kpi"><div class="lbl">Em aberto</div><div class="val">${fmtK(aberto)}</div><div class="sub">a vencer neste ciclo</div></div>
    <div class="kpi"><div class="lbl">Vencido</div><div class="val" style="color:var(--vermelho)">${fmtK(vencido)}</div><div class="sub">${comFat.filter(c=>c.fatura.st==='vencida').length} conta(s) inadimplente(s)</div></div>
    <div class="kpi"><div class="lbl">Inadimplência do Edi</div><div class="val">${inad}%</div><div class="sub">vencido ÷ faturado no ciclo</div></div>
  </div>
  <div class="secao">Faturas por condomínio (contas a receber)</div>
  <div class="card"><div class="tabela-scroll"><table>
    <thead><tr><th>Condomínio</th><th>Vencimento</th><th>Método</th><th>Status</th><th style="text-align:right">Valor</th><th></th></tr></thead>
    <tbody>${lst.map(c=>{const f=c.fatura;const S=FSTAT[f.st];return `<tr>
      <td onclick="abrirCond(${c.id})"><span class="nm">${c.nome}</span><br><small class="muted">${c.cod} · ${admDe(c)}</small></td>
      <td>${f.venc}${f.st==='vencida'?` <small class="muted">(${f.atraso}d atraso)</small>`:''}</td>
      <td>${f.metodo}</td>
      <td><span class="chip ${S.chip}">${S.rot}</span></td>
      <td style="text-align:right; font-weight:700">${fmtBRL(val(c))}</td>
      <td style="text-align:right">${f.st==='paga'?'<span class="muted">—</span>':`<button class="btn sm" onclick="cobrar(${c.id})">Cobrar</button>`}</td>
    </tr>`;}).join('')}</tbody>
  </table></div></div>
  <div class="avlgpd">Esta é a cobrança que a <b>EdiVita</b> faz das contas (contas a receber do provedor) — diferente da inadimplência <b>dos condôminos</b>, que é dado operacional do tenant e não aparece aqui. Onboarding não é cobrado até concluir a ativação.</div>`;
}
function cobrar(id){ const c=CONDS.find(x=>x.id===id); if(!c) return; toast('Lembrete de cobrança enviado ao responsável do '+c.nome+' (simulação).'); }

/* Expansão / upsell: crescer receita na base que já existe */
function proxPlano(p){ return {essencial:'pro', pro:'premium'}[p]||null; }
function candidatosUpsell(){
  return ativos().filter(c=>{ const nx=proxPlano(c.plano); if(!nx) return false; if(saudeScore(c).cls==='vermelho') return false; return ativacao(c)>=55 && c.edi.defl>=0.45 && c.edi.msgs>=c.aptos*0.6; })
    .map(c=>{ const nx=proxPlano(c.plano); return {c, nx, ganho:c.aptos*(PLANOS[nx].preco-PLANOS[c.plano].preco)}; })
    .sort((a,b)=>b.ganho-a.ganho);
}
function finExpansao(){
  const cands=candidatosUpsell();
  const oport=cands.reduce((s,x)=>s+x.ganho,0);
  const addons=CONDS.filter(c=>c.status==='ativo' && c.extras && c.extras.length);
  return `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Oportunidade de upsell</div><div class="val">+${fmtK(oport)}</div><div class="sub">/mês se os candidatos subirem</div></div>
    <div class="kpi"><div class="lbl">Contas candidatas</div><div class="val">${cands.length}</div><div class="sub">usam bem e cabem num plano acima</div></div>
    <div class="kpi"><div class="lbl">NRR (retenção líquida)</div><div class="val">112%</div><div class="sub">expansão supera o churn</div></div>
    <div class="kpi"><div class="lbl">Add-ons ativos</div><div class="val">${addons.length}</div><div class="sub">contas com módulo avulso</div></div>
  </div>
  <div class="secao">Candidatos a upgrade de plano</div>
  <div class="card"><div class="body">
    ${cands.map(({c,nx,ganho})=>`<div class="modrow">
      <span class="chip ${PLANOS[c.plano].cor}" style="min-width:66px; justify-content:center">${PLANOS[c.plano].nome}</span>
      <div class="mi"><b>${c.nome} → ${PLANOS[nx].nome}</b><small>ativação ${ativacao(c)}% · deflexão ${Math.round(c.edi.defl*100)}% · ${c.edi.msgs.toLocaleString('pt-BR')} msgs — usando bem</small></div>
      <b style="color:var(--verde-escuro); white-space:nowrap">+${fmtK(ganho)}/mês</b>
      <button class="btn sm prim" onclick="mudarPlano(${c.id},'${nx}')">Subir p/ ${PLANOS[nx].nome}</button>
    </div>`).join('')||`<div class="muted" style="text-align:center; padding:16px">Sem candidatos claros agora — a base já está no plano certo.</div>`}
  </div></div>
  <div class="secao">Add-ons vendidos (expansão de módulos)</div>
  <div class="card"><div class="body">
    ${addons.length?addons.map(c=>`<div class="modrow"><span class="chip azul" style="min-width:34px; justify-content:center">${c.extras.length}</span><div class="mi"><b>${c.nome}</b><small>${c.extras.map(k=>MODULOS[k].nome).join(', ')}</small></div><button class="btn ghost" style="font-size:12px" onclick="abrirCond(${c.id})">abrir</button></div>`).join(''):`<div class="muted" style="text-align:center; padding:12px">Nenhum add-on avulso ativo.</div>`}
  </div></div>
  <div class="avlgpd">Upsell é crescer receita <b>na base que já existe</b> — o motor de um NRR > 100%. Subir o plano aqui recalcula o MRR na hora (mesma mecânica do detalhe da conta).</div>`;
}

/* ===== Onboarding & ativação (funil das contas novas) ===== */
function telaOnboarding(){
  const obs=CONDS.filter(c=>c.status==='onboarding');
  const travadas=obs.filter(c=>c.onb.dias>20);
  const tempoMedio=18; /* meta-demo: dias médios até ativar */
  return `
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="lbl">Em onboarding</div><div class="val">${obs.length}</div><div class="sub">contas em implantação</div></div>
    <div class="kpi"><div class="lbl">Tempo médio de ativação</div><div class="val">${tempoMedio}d</div><div class="sub">meta: go-live em 30 dias</div></div>
    <div class="kpi"><div class="lbl">Travadas</div><div class="val" style="${travadas.length?'color:var(--vermelho)':''}">${travadas.length}</div><div class="sub">paradas há mais de 20 dias</div></div>
  </div>
  <div class="secao">Funil de ativação — as mesmas fases do onboarding do app</div>
  <div class="card" style="margin-bottom:12px"><div class="body" style="display:flex; gap:16px; flex-wrap:wrap; font-size:12px">
    <span><span class="chip verde">Implementação</span> etapas 1–4 (o síndico configura no app)</span>
    <span><span class="chip dourado">Liberação</span> marco: app liberado aos moradores</span>
    <span><span class="chip azul">Execução</span> ativação &amp; go-live (uso no dia a dia)</span>
  </div></div>
  ${obs.map(c=>{const et=c.onb.etapa, pct=Math.round(100*et/(ONB_ETAPAS.length-1)), trav=c.onb.dias>20;return `
  <div class="card" style="margin-bottom:12px${trav?'; border-color:var(--vermelho)':''}"><div class="body">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px">
      <b style="flex:1">${c.nome} <span class="muted" style="font-weight:500">· ${c.cidade} · ${c.aptos} un.</span></b>
      <span class="chip ${et<ONB_LIBERA?'laranja':'azul'}">${et<ONB_LIBERA?'implementação':'execução'}</span>
      <span class="chip ${trav?'vermelho':'cinza'}">${trav?'travada':'em curso'} · ${c.onb.dias}d</span>
    </div>
    <div class="barra" style="height:9px; margin-bottom:10px"><i style="width:${pct}%"></i></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px">
      ${ONB_ETAPAS.map((e,i)=>{const feito=i<et, atual=i===et, marco=i===ONB_LIBERA; const cor=feito?'verde':(atual?(marco?'dourado':'laranja'):'cinza'); return `<span class="chip ${cor}" style="font-size:10.5px${marco?'; border:1px solid var(--dourado)':''}">${feito?'✓ ':''}${marco?'★ ':''}${e}</span>`;}).join('')}
    </div>
    <div class="modrow" style="border:none; padding:0"><div class="mi"><small style="color:var(--verde-escuro)"><b>Próximo passo:</b> ${c.onb.prox}</small></div>
      <button class="btn ghost" style="font-size:12px" onclick="abrirCond(${c.id})">abrir conta</button>
      <button class="btn sm prim" onclick="avancarOnb(${c.id})">Marcar etapa concluída</button>
    </div>
  </div></div>`;}).join('')||`<div class="card"><div class="body muted" style="text-align:center; padding:20px">Nenhuma conta em onboarding — carteira toda ativada.</div></div>`}
  <div class="avlgpd">O funil espelha o <b>onboarding guiado do app</b>: as etapas 1–4 são a <b>implementação</b> (o síndico configura), o marco <b>★ App liberado aos moradores</b> encerra a implementação, e daí começa a <b>execução</b> (ativação → go-live), quando a conta passa a contar no MRR.</div>`;
}
function avancarOnb(id){ const c=CONDS.find(x=>x.id===id); if(!c||!c.onb) return;
  if(c.onb.etapa>=ONB_ETAPAS.length-1){ mudarStatus(id,'ativo'); toast(c.nome+': go-live concluído — conta ativada.'); return; }
  c.onb.etapa++; c.onb.dias=1; toast(c.nome+': etapa "'+ONB_ETAPAS[c.onb.etapa]+'" concluída.'); render();
}

/* ===== Planos & módulos (catálogo) ===== */
function telaPlanos(){
  return `
  <div class="secao">Planos oferecidos</div>
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    ${Object.keys(PLANOS).map(p=>{const P=PLANOS[p];const n=CONDS.filter(c=>c.plano===p&&c.status==='ativo').length;return `<div class="card"><div class="body">
      <span class="chip ${P.cor}">${P.nome}</span>
      <div class="val" style="font-size:26px; font-weight:800; margin:10px 0 2px">${fmtBRL(P.preco)}<span class="muted" style="font-size:13px; font-weight:600">/unidade/mês</span></div>
      <div class="muted" style="font-size:12px; margin-bottom:10px">${n} condomínios ativos neste plano</div>
      ${Object.keys(MODULOS).map(k=>`<div style="font-size:12.5px; padding:3px 0; ${P.base.includes(k)?'':'opacity:.4'}">${P.base.includes(k)?'✓':'–'} ${MODULOS[k].nome}</div>`).join('')}
    </div></div>`;}).join('')}
  </div>
  <div class="secao">Catálogo de módulos</div>
  <div class="card"><div class="body">
    ${Object.keys(MODULOS).map(k=>{const emN=Object.values(PLANOS).filter(P=>P.base.includes(k)).length;const uso=CONDS.filter(c=>c.mods[k]&&c.status==='ativo').length;return `<div class="modrow"><span class="chip verde" style="min-width:44px; justify-content:center">${uso}</span><div class="mi"><b>${MODULOS[k].nome}</b><small>${MODULOS[k].desc}</small></div><span class="chip cinza">em ${emN} plano${emN>1?'s':''}</span></div>`;}).join('')}
  </div></div>
  <div class="avlgpd">Ligar/desligar módulo por condomínio é feito no <b>detalhe da conta</b> (aba Condomínios → abrir). Aqui é a visão de catálogo: preço dos planos e quantas contas usam cada módulo.</div>`;
}

/* ===== ações (mutam estado + re-render) ===== */
function toggleMod(id,k){
  const c=CONDS.find(x=>x.id===id); if(!c) return;
  const noPlano=(PLANOS[c.plano].base||[]).includes(k);
  c.mods[k]=!c.mods[k];
  if(!c.mods[k]) c.extras=(c.extras||[]).filter(x=>x!==k); else if(!noPlano && !(c.extras||[]).includes(k)) (c.extras=c.extras||[]).push(k);
  toast(`${MODULOS[k].nome}: ${c.mods[k]?'ativado':'desativado'} no ${c.nome}`);
  render();
}
function mudarPlano(id,p){
  const c=CONDS.find(x=>x.id===id); if(!c) return;
  c.plano=p; c.mods=modsDoPlano(p, c.extras);
  toast(`Plano do ${c.nome} alterado para ${PLANOS[p].nome}.`);
  render();
}
function mudarStatus(id,s){
  const c=CONDS.find(x=>x.id===id); if(!c) return;
  c.status=s; if(s==='suspenso') c.usando=c.usando;
  toast(`${c.nome}: conta ${STATUS[s].rot.toLowerCase()}.`);
  render();
}

/* boot */
$('#ver').textContent=VERSAO;
$('#buscaWrap').style.display='none';
render();
</script>
</body>
</html>
